<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            background: #4a76a8;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Test Registration</h1>
    
    <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe">
    </div>
    
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="john@example.com">
    </div>
    
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimum 6 characters">
    </div>
    
    <button onclick="register()">Register</button>
    
    <div id="result"></div>
    <div id="data"></div>
    
    <script>
        function register() {
            // Get form data
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Validation
            if (!name || !email || !password) {
                document.getElementById('result').innerHTML = '<div class="error">All fields are required</div>';
                return;
            }
            
            if (password.length < 6) {
                document.getElementById('result').innerHTML = '<div class="error">Password must be at least 6 characters</div>';
                return;
            }
            
            // Prepare data
            const data = { name, email, password };
            
            // Show what we're sending
            document.getElementById('data').innerHTML = `
                <h3>Sending:</h3>
                <pre>${JSON.stringify({...data, password: '[REDACTED]'}, null, 2)}</pre>
            `;
            
            // Make API request
            fetch('https://automatehub-pdpd.onrender.com/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                document.getElementById('result').innerHTML += `
                    <div>Status: ${response.status} ${response.statusText}</div>
                `;
                return response.json();
            })
            .then(data => {
                console.log('Response:', data);
                
                if (data.token) {
                    document.getElementById('result').innerHTML += `
                        <div class="success">
                            <h3>Registration Successful!</h3>
                            <p>Token: ${data.token.substring(0, 20)}...</p>
                        </div>
                    `;
                } else if (data.errors) {
                    const errorMessages = data.errors.map(e => e.msg).join('<br>');
                    document.getElementById('result').innerHTML += `
                        <div class="error">
                            <h3>Validation Errors:</h3>
                            <p>${errorMessages}</p>
                        </div>
                    `;
                } else if (data.message) {
                    document.getElementById('result').innerHTML += `
                        <div class="error">
                            <h3>Error:</h3>
                            <p>${data.message}</p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('result').innerHTML += `
                    <div class="error">
                        <h3>Error:</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
